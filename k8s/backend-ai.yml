apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai
        image: shounak26/inkspace-ai-service:latest
        ports:
        - containerPort: 5004
        envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: app-secrets
        env:
          # The service reads MONGO_URL / GEMINI_API_KEY / GEMINI_MODEL;
          # map them explicitly from the shared ConfigMap/Secret keys
          # rather than relying on a same-named key existing in either.
          - name: MONGO_URL
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: AI_MONGO_URI
          - name: GEMINI_MODEL
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: GEMINI_MODEL
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: GEMINI_API_KEY
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 5004
      targetPort: 5004
