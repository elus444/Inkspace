apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics
        image: shounak26/inkspace-analytics-service:latest
        ports:
        - containerPort: 5005
        envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: app-secrets
        env:
          # The service reads MONGO_URL; map it explicitly from the shared
          # ConfigMap's key rather than relying on a same-named key existing.
          - name: MONGO_URL
            valueFrom:
              configMapKeyRef:
                name: app-config
                key: ANALYTICS_MONGO_URI
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector:
    app: analytics-service
  ports:
    - port: 5005
      targetPort: 5005
