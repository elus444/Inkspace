name: Keep Render services warm

# Render's free tier spins a service down after ~15 minutes with no inbound
# traffic, and the next request pays a 30-50s cold-start penalty. Pinging
# each service every 10 minutes keeps them all warm well inside that window.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend + frontend services
        run: |
          urls=(
            "https://inkspace-auth.onrender.com/"
            "https://inkspace-post.onrender.com/"
            "https://inkspace-comment.onrender.com/"
            "https://inkspace-like.onrender.com/"
            "https://inkspace-ai.onrender.com/health"
            "https://inkspace-analytics.onrender.com/health"
            "https://inkspace-frontend.onrender.com/"
          )
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$url" || echo "000")
            echo "$url -> $code"
          done
