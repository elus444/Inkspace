envVarGroups:
  - name: inkspace-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true

services:
  - type: web
    name: inkspace-auth
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/auth/Dockerfile
    dockerContext: ./services/auth
    envVarGroups:
      - inkspace-shared
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false

  - type: web
    name: inkspace-post
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/post/Dockerfile
    dockerContext: ./services/post
    envVarGroups:
      - inkspace-shared
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URL
        sync: false

  - type: web
    name: inkspace-comment
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/comment/Dockerfile
    dockerContext: ./services/comment
    envVarGroups:
      - inkspace-shared
    envVars:
      - key: PORT
        value: 5002
      - key: MONGO_URL
        sync: false

  - type: web
    name: inkspace-like
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/like/Dockerfile
    dockerContext: ./services/like
    envVarGroups:
      - inkspace-shared
    envVars:
      - key: PORT
        value: 5003
      - key: MONGO_URL
        sync: false

  - type: web
    name: inkspace-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_AUTH_URL
        value: https://inkspace-auth.onrender.com/api/auth
      - key: VITE_POST_URL
        value: https://inkspace-post.onrender.com/api/posts
      - key: VITE_COMMENT_URL
        value: https://inkspace-comment.onrender.com/api/comments
      - key: VITE_LIKE_URL
        value: https://inkspace-like.onrender.com/api/likes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
